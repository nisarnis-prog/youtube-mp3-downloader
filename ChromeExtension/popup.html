<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nisar MP3 Downloader Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="logo">YT</div>
    <h1>Nisar MP3 Downloader Companion</h1>
  </header>

  <section class="page">
    <span class="label">Current page:</span>
    <p id="currentPage" class="page-title">Checking&hellip;</p>
  </section>

  <section id="actions" class="actions" hidden>
    <button id="addQueue" class="btn secondary" type="button">Add to Queue</button>
    <button id="addStart" class="btn primary" type="button">Add &amp; Start</button>
  </section>

  <p id="unsupported" class="unsupported" hidden>This page is not a supported YouTube video.</p>
  <p id="status" class="status" hidden></p>

  <footer>Built by Nisar</footer>

  <script src="popup.js"></script>
</body>
</html>
